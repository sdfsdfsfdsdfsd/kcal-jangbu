name: 식약처 음식 칼로리 DB 반영
on:
  push:
    paths: ["scripts/assemble_foods.py", ".github/workflows/foods.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/assemble_foods.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add foods.json
          git diff --cached --quiet || (git commit -m "음식 칼로리 DB 반영 (식약처)" && git push)
